<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Setting - ระบบตั้งค่าหลักการโหราศาสตร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-purple-50/40 text-slate-800 min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white border border-purple-100 rounded-2xl shadow-xl p-6">
        <div class="flex justify-between items-center border-b border-purple-100 pb-4 mb-6">
            <h1 class="text-xl font-bold text-purple-950 flex items-center gap-2">
                ⚙️ ตั้งค่าแก่นวิชาของสำนัก (School Rules Management)
            </h1>
            <button id="saveBtn" onclick="saveRules()" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl text-sm transition">
                💾 บันทึกข้อมูลทั้งหมด
            </button>
        </div>

        <!-- Setting Sections -->
        <div class="space-y-6">
            <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-100">
                <h2 class="text-md font-bold text-purple-900 mb-2">1. หลักการวิเคราะห์พื้นดวง 7 หมวดหมู่</h2>
                <div id="natalForm" class="space-y-3">
                    <!-- Dynamic Textareas for 7 Categories -->
                </div>
            </div>

            <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-100">
                <h2 class="text-md font-bold text-purple-900 mb-2">2. หลักการความรัก & ดาวเจ้าเรือน 7 / Midpoints</h2>
                <textarea id="loveRulesInput" rows="6" class="w-full p-3 border border-purple-200 rounded-xl text-sm font-mono focus:outline-none" placeholder="ระบุกฎดาวเจ้าเรือน 7, Retrograde หรือ Sun/Moon Midpoint..."></textarea>
            </div>
        </div>
    </div>

    <script>
        async function loadRules() {
            const res = await fetch('/api/rules');
            const data = await res.json();
            const container = document.getElementById('natalForm');
            container.innerHTML = '';

            for (const [key, val] of Object.entries(data.natal_categories)) {
                container.innerHTML += `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">หมวด: ${key}</label>
                        <textarea id="rule_${key}" rows="2" class="w-full p-2.5 border border-purple-200 rounded-xl text-sm focus:outline-none">${val}</textarea>
                    </div>
                `;
            }
            document.getElementById('loveRulesInput').value = JSON.stringify(data.love_rules, null, 2);
        }

        async function saveRules() {
            // Collect Form Data & POST to /api/rules
            alert("บันทึกหลักการเรียบร้อยแล้ว");
        }

        loadRules();
    </script>
</body>
</html>
