<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - จัดการหลักการโหราศาสตร์ 7 หมวด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-purple-50/40 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white border border-purple-100 rounded-2xl shadow-xl p-6">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-purple-100 pb-5 mb-6">
            <div>
                <h1 class="text-xl font-bold text-purple-950 flex items-center gap-2">
                    ⚙️ จัดการคลังหลักการประจำสำนัก (School Knowledge Base)
                </h1>
                <p class="text-xs text-purple-600 mt-1">
                    * ข้อมูลที่เคยบันทึกไว้จะถูกดึงมาแสดงในแต่ละ Tab อัตโนมัติ หมวดใดเว้นว่างไว้ ระบบจะใช้ AI พยากรณ์ตามหลักสากล
                </p>
            </div>
            <button onclick="saveRules()" id="saveBtn" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-md shadow-purple-900/10 flex items-center gap-2">
                <span>💾 บันทึกข้อมูลทุกหมวด</span>
            </button>
        </div>

        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <div class="flex border-b border-purple-200 overflow-x-auto gap-1 mb-6" id="tabHeader">
            <button onclick="switchTab('tab_1')" id="btn_tab_1" class="tab-btn px-4 py-2.5 text-xs font-bold rounded-t-xl transition border-b-2 border-purple-700 text-purple-900 bg-purple-50">1. นิสัย บุคลิกภาพ</button>
            <button onclick="switchTab('tab_2')" id="btn_tab_2" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">2. การเงิน</button>
            <button onclick="switchTab('tab_3')" id="btn_tab_3" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">3. การงาน อาชีพ</button>
            <button onclick="switchTab('tab_4')" id="btn_tab_4" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">4. ความรัก (รวมกฎเจาะลึก)</button>
            <button onclick="switchTab('tab_5')" id="btn_tab_5" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">5. จุดเด่น/จุดด้อย</button>
            <button onclick="switchTab('tab_6')" id="btn_tab_6" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">6. ศักยภาพและการพัฒนา</button>
            <button onclick="switchTab('tab_7')" id="btn_tab_7" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">7. ปัญหาที่ต้องปรับปรุง</button>
            <button onclick="switchTab('tab_8')" id="btn_tab_8" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-t-xl transition text-slate-500 hover:text-purple-700">8. สูตร Deep Report (12 มิติ)</button>
        </div>

        <div id="tabContents">
            <div id="tab_1" class="tab-content">
                <label class="block text-sm font-bold text-purple-900 mb-1">1. นิสัย บุคลิกภาพ (Personality)</label>
                <textarea id="cat_1_personality" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการวิเคราะห์นิสัย/บุคลิกภาพที่นี่..."></textarea>
            </div>

            <div id="tab_2" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">2. การเงิน (Finance & Assets)</label>
                <textarea id="cat_2_finance" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการวิเคราะห์การเงินที่นี่..."></textarea>
            </div>

            <div id="tab_3" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">3. การงาน อาชีพ ที่ตรงกับดวง (Career & Vocation)</label>
                <textarea id="cat_3_career" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการวิเคราะห์การงานอาชีพที่นี่..."></textarea>
            </div>

            <div id="tab_4" class="tab-content hidden space-y-4">
                <div>
                    <label class="block text-sm font-bold text-purple-900 mb-1">4.1 ภาพรวมหลักการความรักทั่วไป</label>
                    <textarea id="cat_4_love" rows="4" class="w-full p-3 border border-purple-200 rounded-xl text-xs font-mono focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการความรักทั่วไป..."></textarea>
                </div>
                
                <div class="border-t border-purple-100 pt-3 space-y-3">
                    <h3 class="text-xs font-bold text-purple-900 uppercase tracking-wider">❤️ กฎความรักเจาะลึกเฉพาะสำนัก</h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">1. ดัชนีชี้วัดแรงดึงดูด & LGBTQ+</label>
                        <textarea id="love_attraction" rows="2" class="w-full p-2.5 border border-purple-200 rounded-lg text-xs font-mono focus:border-purple-600 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">2. สัญลักษณ์ความรักซับซ้อน (Uranus / Hades / Neptune)</label>
                        <textarea id="love_complex" rows="2" class="w-full p-2.5 border border-purple-200 rounded-lg text-xs font-mono focus:border-purple-600 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">3. ดาวที่ทำมุมกับ Sun/Moon Midpoint</label>
                        <textarea id="love_midpoints" rows="3" class="w-full p-2.5 border border-purple-200 rounded-lg text-xs font-mono focus:border-purple-600 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">4. เรือนที่ 7, ตำแหน่งดาวเจ้าเรือน Placidus & สถานะ Retrograde</label>
                        <textarea id="love_house7" rows="3" class="w-full p-2.5 border border-purple-200 rounded-lg text-xs font-mono focus:border-purple-600 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">5. ความหมายดาวสถิตในเรือนที่ 7</label>
                        <textarea id="love_planets_h7" rows="3" class="w-full p-2.5 border border-purple-200 rounded-lg text-xs font-mono focus:border-purple-600 focus:outline-none"></textarea>
                    </div>
                </div>
            </div>

            <div id="tab_5" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">5. จุดเด่น จุดด้อย และการแก้จุดด้อย (Strengths & Weaknesses)</label>
                <textarea id="cat_5_strengths_weaknesses" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการจุดเด่นจุดด้อยที่นี่..."></textarea>
            </div>

            <div id="tab_6" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">6. ศักยภาพที่มี และวิธีการพัฒนา (Potentials & Development)</label>
                <textarea id="cat_6_potentials" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการพัฒนาศักยภาพที่นี่..."></textarea>
            </div>

            <div id="tab_7" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">7. ปัญหาที่ต้องปรับปรุง เพื่อความก้าวหน้า (Growth & Challenges)</label>
                <textarea id="cat_7_growth" rows="14" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="ใส่หลักการปัญหาที่ต้องปรับปรุงที่นี่..."></textarea>
            </div>

            <div id="tab_8" class="tab-content hidden">
                <label class="block text-sm font-bold text-purple-900 mb-1">8. ตรรกะและสูตรการแปล Deep Report 12 มิติ</label>
                <p class="text-xs text-purple-600 mb-3">วางโครงสร้าง วิธีดู Step-by-Step และสูตร Aspect ที่ต้องการให้ AI ใช้ในการเขียนรายงานเจาะลึกที่นี่</p>
                <textarea id="deep_report_rules" rows="18" class="w-full p-4 border border-purple-200 rounded-xl text-xs font-mono leading-relaxed focus:border-purple-600 focus:outline-none" placeholder="เช่น Step 1 - ดู Sun, Step 2 - หา Aspect ที่แรงที่สุด..."></textarea>
            </div>
        </div>

    </div>

    <script>
        const categories = [
            '1_personality', '2_finance', '3_career', 
            '4_love', '5_strengths_weaknesses', '6_potentials', '7_growth'
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-b-2', 'border-purple-700', 'text-purple-900', 'bg-purple-50', 'font-bold');
                el.classList.add('text-slate-500', 'font-semibold');
            });

            document.getElementById(tabId).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn_${tabId}`);
            activeBtn.classList.remove('text-slate-500', 'font-semibold');
            activeBtn.classList.add('border-b-2', 'border-purple-700', 'text-purple-900', 'bg-purple-50', 'font-bold');
        }

        async function loadRules() {
            try {
                const res = await fetch('/api/rules');
                if (!res.ok) return;
                const data = await res.json();
                
                const natal = data.natal_categories || {};
                categories.forEach(cat => {
                    const el = document.getElementById(`cat_${cat}`);
                    if (el && natal[cat] !== undefined) {
                        el.value = natal[cat];
                    }
                });

                const loveAdv = data.love_advanced_rules || {};
                if (document.getElementById('love_attraction')) document.getElementById('love_attraction').value = loveAdv.personal_attraction_indicators || '';
                if (document.getElementById('love_complex')) document.getElementById('love_complex').value = loveAdv.complex_relationship_indicators || '';
                if (document.getElementById('love_midpoints')) document.getElementById('love_midpoints').value = loveAdv.sun_moon_midpoint_rules || '';
                if (document.getElementById('love_house7')) document.getElementById('love_house7').value = loveAdv.house_7_and_ruler_rules || '';
                if (document.getElementById('love_planets_h7')) document.getElementById('love_planets_h7').value = loveAdv.planets_in_7th_house || '';
                if (document.getElementById('deep_report_rules')) document.getElementById('deep_report_rules').value = data.deep_report_rules || '';

                showAlert('โหลดข้อมูลหลักการเดิมเรียบร้อยแล้ว', 'success');

            } catch (err) {
                showAlert('ไม่สามารถดึงข้อมูลหลักการเดิมได้: ' + err.message, 'error');
            }
        }

        async function saveRules() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "กำลังบันทึกข้อมูล...";
            payload.deep_report_rules = document.getElementById('deep_report_rules').value;

            const payload = {
                school_name: "สำนักโหราศาสตร์วิวัฒนาการ",
                natal_categories: {},
                love_advanced_rules: {
                    personal_attraction_indicators: document.getElementById('love_attraction').value,
                    complex_relationship_indicators: document.getElementById('love_complex').value,
                    sun_moon_midpoint_rules: document.getElementById('love_midpoints').value,
                    house_7_and_ruler_rules: document.getElementById('love_house7').value,
                    planets_in_7th_house: document.getElementById('love_planets_h7').value
                }
            };

            categories.forEach(cat => {
                const el = document.getElementById(`cat_${cat}`);
                payload.natal_categories[cat] = el ? el.value : '';
            });

            try {
                const res = await fetch('/api/rules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (res.ok) {
                    showAlert(result.message || 'บันทึกหลักการทุกหมวดเรียบร้อยแล้ว', 'success');
                } else {
                    throw new Error(result.detail || 'เกิดข้อผิดพลาดในการบันทึก');
                }
            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "💾 บันทึกข้อมูลทุกหมวด";
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-100', 'text-emerald-800');
            } else {
                alertBox.classList.add('bg-rose-100', 'text-rose-800');
            }
            alertBox.innerText = msg;
            setTimeout(() => alertBox.classList.add('hidden'), 3500);
        }

        loadRules();
    </script>
</body>
</html>
