<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolutionary Astrology Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h2 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; }
    .row { display: flex; gap: 8px; }
    button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .btn-qa { background: #d97706; }
    .btn-qa:hover { background: #b45309; }
    .result-box { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; }
    .debug-box { margin-top: 20px; background: #020617; border: 1px solid #dc2626; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: #f87171; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="container">
  <!-- ฝั่งรับข้อมูล -->
  <div class="card">
    <h2>✨ ข้อมูลวันเวลาและสถานที่เกิด</h2>
    
    <div class="form-group">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="userName" value="คุณไอซ์" placeholder="ระบุชื่อ">
    </div>

    <div class="form-group">
      <label>วัน / เดือน / ปีเกิด (พ.ศ.)</label>
      <div class="row">
        <input type="number" id="day" value="15" placeholder="วัน">
        <input type="number" id="month" value="8" placeholder="เดือน">
        <input type="number" id="year" value="2538" placeholder="ปี พ.ศ.">
      </div>
    </div>

    <div class="form-group">
      <label>เวลาเกิด (ชั่วโมง : นาที)</label>
      <div class="row">
        <input type="number" id="hour" value="14" placeholder="ชั่วโมง">
        <input type="number" id="minute" value="30" placeholder="นาที">
      </div>
    </div>

    <div class="form-group">
      <label>จังหวัดที่เกิด (ประเทศไทย)</label>
      <input type="text" id="location" value="กรุงเทพมหานคร" placeholder="เช่น กรุงเทพมหานคร, เชียงใหม่">
    </div>

    <button onclick="calculateNatal()">🔮 คำนวณพื้นดวงพัฒนาศักยภาพ</button>

    <hr style="border:0; border-top:1px solid #334155; margin: 20px 0;">

    <h2>❓ ถามคำถามเจาะจง (Real-time Transit)</h2>
    <div class="form-group">
      <textarea id="question" rows="3" placeholder="เช่น ผมจะได้งานใหม่เมื่อไหร่? ปัญหาตอนนี้จะแก้อย่างไร?"></textarea>
    </div>
    <button class="btn-qa" onclick="askTransitQA()">⚡ คำนวณ Transit ตอบคำถาม</button>
  </div>

  <!-- ฝั่งแสดงผล -->
  <div class="card">
    <h2>📊 ผลวิเคราะห์โหราศาสตร์วิวัฒนาการ</h2>
    <div id="resultOutput" class="result-box">กดปุ่มคำนวณด้านซ้ายเพื่อเริ่มการวิเคราะห์...</div>

    <!-- กล่อง Debug Console บังคับแสดงผลลัพธ์ Network/API แบบดิบ -->
    <div id="debugBox" class="debug-box" style="display: none;">
      <strong>🛠️ DEBUG LOG CONSOLE:</strong>
      <pre id="debugContent" style="white-space: pre-wrap; margin-top: 6px;"></pre>
    </div>
  </div>
</div>

<script>
  function showDebug(title, data) {
    const debugBox = document.getElementById('debugBox');
    const debugContent = document.getElementById('debugContent');
    debugBox.style.display = 'block';
    const time = new Date().toLocaleTimeString();
    let text = `\n[${time}] === ${title} ===\n`;
    text += (typeof data === 'object') ? JSON.stringify(data, null, 2) : data;
    debugContent.textContent += text;
  }

  function getPayload() {
    return {
      user_name: document.getElementById('userName').value || 'ลูกดวง',
      day: document.getElementById('day').value,
      month: document.getElementById('month').value,
      year: document.getElementById('year').value,
      hour: document.getElementById('hour').value || 0,
      minute: document.getElementById('minute').value || 0,
      location: document.getElementById('location').value || 'กรุงเทพมหานคร',
      question: document.getElementById('question').value
    };
  }

  async function calculateNatal() {
    document.getElementById('debugContent').textContent = '';
    document.getElementById('resultOutput').innerText = 'กำลังคำนวณองศาดาวและประมวลผล AI...';
    
    const payload = getPayload();
    showDebug('1. REQUEST PAYLOAD', payload);

    try {
      const res = await fetch('/api/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      showDebug('2. HTTP STATUS', `${res.status} ${res.statusText}`);
      const data = await res.json();
      showDebug('3. RESPONSE DATA', data);

      if (data.status === 'success') {
        document.getElementById('resultOutput').innerText = data.analysis;
      } else {
        document.getElementById('resultOutput').innerText = '❌ เกิดข้อผิดพลาดในการประมวลผล';
        showDebug('❌ SERVER ERROR TRACEBACK', data.traceback || data.message);
      }
    } catch (err) {
      showDebug('❌ FETCH/NETWORK ERROR', err.message);
      document.getElementById('resultOutput').innerText = '❌ ไม่สามารถเชื่อมต่อ Server ได้';
    }
  }

  async function askTransitQA() {
    document.getElementById('debugContent').textContent = '';
    document.getElementById('resultOutput').innerText = 'กำลังคำนวณดาวจร Real-time และวิเคราะห์คำตอบ...';
    
    const payload = getPayload();
    showDebug('1. TRANSIT QA REQUEST', payload);

    try {
      const res = await fetch('/api/transit-qa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      showDebug('2. HTTP STATUS', `${res.status} ${res.statusText}`);
      const data = await res.json();
      showDebug('3. RESPONSE DATA', data);

      if (data.status === 'success') {
        document.getElementById('resultOutput').innerText = data.answer;
      } else {
        document.getElementById('resultOutput').innerText = '❌ เกิดข้อผิดพลาดในการประมวลผลคำถาม';
        showDebug('❌ SERVER ERROR TRACEBACK', data.traceback || data.message);
      }
    } catch (err) {
      showDebug('❌ FETCH/NETWORK ERROR', err.message);
      document.getElementById('resultOutput').innerText = '❌ ไม่สามารถเชื่อมต่อ Server ได้';
    }
  }
</script>

</body>
</html>
