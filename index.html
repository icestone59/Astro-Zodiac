<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Uranian - Evolutionary Astrology</title>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS Theme (อิงจากภาพ image_8c6e3f.png) -->
    <style>
        :root {
            --bg-body: #0f111a;
            --bg-panel: #1a1d29;
            --bg-input: #0b0d14;
            --text-main: #e2e8f0;
            --text-label: #94a3b8;
            --accent-purple: #8b5cf6;
            --btn-purple: #7c3aed;
            --btn-gray: #475569;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 30px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h2 { color: var(--accent-purple); margin-top: 0; font-size: 1.4rem; margin-bottom: 20px; }

        .row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 120px; }

        label { display: block; font-size: 0.9rem; color: var(--text-label); margin-bottom: 8px; }
        
        input, textarea {
            width: 100%;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-purple); }

        button {
            border: none; border-radius: 6px; padding: 12px 20px;
            color: white; font-size: 1rem; cursor: pointer; font-weight: bold;
            transition: 0.2s; margin-right: 10px; margin-bottom: 10px;
        }
        .btn-primary { background-color: var(--btn-purple); }
        .btn-primary:hover { background-color: #6d28d9; }
        
        .btn-secondary { background-color: var(--btn-gray); }
        .btn-secondary:hover { background-color: #334155; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ส่วนแสดงผลลัพธ์ */
        #status-message { font-weight: bold; margin-bottom: 15px; display: none; color: #34d399; }
        .error-text { color: #f87171 !important; }
        
        #charts-wrapper { display: none; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: var(--bg-input); padding: 15px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        
        #report-content h3 { color: var(--accent-purple); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 30px;}
        #report-content strong { color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <!-- Panel 1: Birth Chart Input -->
    <div class="panel">
        <h2>ข้อมูลดวงชะตากำเนิด (Birth Chart)</h2>
        <div class="row">
            <div class="col" style="flex: 2;">
                <label>ชื่อ-นามแฝง</label>
                <input type="text" id="user_name" value="คุณไอซ์">
            </div>
            <div class="col" style="flex: 2;">
                <label>สถานที่เกิด (จังหวัด)</label>
                <input type="text" id="location_name" value="กรุงเทพมหานคร">
            </div>
        </div>
        <div class="row">
            <div class="col"><label>วันที่เกิด</label><input type="number" id="day" value="1"></div>
            <div class="col"><label>เดือนที่เกิด</label><input type="number" id="month" value="1"></div>
            <div class="col"><label>ปีที่เกิด (พ.ศ.)</label><input type="number" id="year" value="2538"></div>
            <div class="col"><label>เวลาเกิด (ชั่วโมง)</label><input type="number" id="hour" value="12"></div>
            <div class="col"><label>เวลาเกิด (นาที)</label><input type="number" id="minute" value="0"></div>
        </div>
        <button class="btn-primary" id="btn-calculate" onclick="calculateChart()">1. คำนวณองศาดาว (Calculate Chart)</button>
    </div>

    <!-- Panel 2: Analysis Tools -->
    <div class="panel">
        <h2>คำทำนายเชิงพัฒนาศักยภาพ</h2>
        <div class="row">
            <div class="col">
                <label>คำถามเฉพาะเจาะจง (Transit Q&A)</label>
                <textarea id="question" rows="3" placeholder="เช่น ผมจะได้งานเมื่อไหร่? หรือ ปัญหาที่กำลังเกิดจะแก้อย่างไร?"></textarea>
            </div>
        </div>
        <div>
            <button class="btn-secondary" id="btn-natal7" onclick="analyzeAI('natal_7')">วิเคราะห์พื้นดวง 7 หมวด</button>
            <button class="btn-secondary" id="btn-deep" onclick="analyzeAI('deep_report')">วิเคราะห์ Deep Report + กราฟ</button>
            <button class="btn-secondary" id="btn-transit" onclick="analyzeAI('transit_qa')">ถาม-ตอบ (Transit)</button>
        </div>
        <div id="status-message"></div>
    </div>

    <!-- Panel 3: Results -->
    <div class="panel" id="result-panel" style="display: none;">
        <h2>Insight Analytics</h2>
        
        <!-- Graph Area -->
        <div id="charts-wrapper">
            <div class="chart-box"><canvas id="potentialRadarChart"></canvas></div>
            <div class="chart-box"><canvas id="potentialBarChart"></canvas></div>
        </div>

        <!-- Text Area -->
        <div id="report-content"></div>
    </div>
</div>

<!-- โหลดไฟล์ Logic แยกต่างหาก -->
<script src="logic.js"></script>

</body>
</html>
