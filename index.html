<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Uranian - Evolutionary Astrology</title>

    <!-- ไลบรารีสำหรับแสดงผลข้อความ Markdown และสร้างกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS: คงโครงสร้าง Layout แนว Dark Theme (สามารถใช้ร่วมกับคลาสเดิมของคุณได้) -->
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #151b2b;
            --text-light: #e2e8f0;
            --accent: #6b4ce6;
            --accent-hover: #5a3bc2;
            --border: #2d3748;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .panel {
            background: var(--panel-bg);
            padding: 25px; border-radius: 12px;
            margin-bottom: 25px; border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        h1, h2, h3 { color: var(--accent); margin-top: 0; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 120px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #a0aec0; }
        input, select, textarea {
            width: 100%; padding: 10px;
            background: var(--bg-dark); color: white;
            border: 1px solid var(--border); border-radius: 6px;
            box-sizing: border-box; font-family: inherit;
        }
        button {
            background: var(--accent); color: white;
            border: none; padding: 12px 20px; border-radius: 6px;
            cursor: pointer; font-size: 16px; font-weight: bold;
            transition: 0.2s; margin-right: 10px; margin-bottom: 10px;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #4a5568; cursor: not-allowed; }
        
        /* Layout สำหรับกราฟ */
        .charts-container {
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
            margin-top: 20px; margin-bottom: 20px;
        }
        .chart-box {
            flex: 1; min-width: 300px; max-width: 400px;
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;
        }
        
        /* สถานะโหลดข้อมูล */
        #status-message {
            color: #38b2ac; font-weight: bold; margin-bottom: 15px; display: none;
        }
        .error-text { color: #fc8181 !important; }
        #report-content { margin-top: 20px; }
        #report-content h3 { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ส่วนที่ 1: ข้อมูลบุคคล (Birth Data) -->
    <div class="panel">
        <h2>ข้อมูลดวงชะตากำเนิด (Birth Chart)</h2>
        <div class="form-row">
            <div class="form-group">
                <label>ชื่อ-นามแฝง</label>
                <input type="text" id="user_name" placeholder="ชื่อของคุณ" value="คุณไอซ์">
            </div>
            <div class="form-group">
                <label>สถานที่เกิด (จังหวัด)</label>
                <input type="text" id="location_name" placeholder="เช่น กรุงเทพมหานคร" value="กรุงเทพมหานคร">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>วันที่เกิด</label>
                <input type="number" id="day" min="1" max="31" value="1">
            </div>
            <div class="form-group">
                <label>เดือนที่เกิด</label>
                <input type="number" id="month" min="1" max="12" value="1">
            </div>
            <div class="form-group">
                <label>ปีที่เกิด (พ.ศ.)</label>
                <input type="number" id="year" value="2538">
            </div>
            <div class="form-group">
                <label>เวลาเกิด (ชั่วโมง)</label>
                <input type="number" id="hour" min="0" max="23" value="12">
            </div>
            <div class="form-group">
                <label>เวลาเกิด (นาที)</label>
                <input type="number" id="minute" min="0" max="59" value="0">
            </div>
        </div>
        <button id="btn-calculate" onclick="calculateChart()">1. คำนวณองศาดาว (Calculate Chart)</button>
    </div>

    <!-- ส่วนที่ 2: เครื่องมือวิเคราะห์ (Analysis Tools) -->
    <div class="panel">
        <h2>คำทำนายเชิงพัฒนาศักยภาพ</h2>
        
        <!-- ถาม-ตอบ Transit -->
        <div class="form-group" style="margin-bottom: 20px;">
            <label>คำถามเฉพาะเจาะจง (Transit Q&A)</label>
            <textarea id="question" rows="2" placeholder="เช่น ผมจะได้งานเมื่อไหร่? หรือ ปัญหาที่กำลังเกิดจะแก้อย่างไร?"></textarea>
        </div>

        <div>
            <button id="btn-natal7" onclick="analyzeAI('natal_7')" disabled>วิเคราะห์พื้นดวง 7 หมวด</button>
            <button id="btn-deep" onclick="analyzeAI('deep_report')" disabled>วิเคราะห์ Deep Report + กราฟ</button>
            <button id="btn-transit" onclick="analyzeAI('transit_qa')" disabled>ถาม-ตอบ (Transit)</button>
        </div>

        <div id="status-message">กำลังประมวลผล... โปรดรอสักครู่</div>
    </div>

    <!-- ส่วนที่ 3: แสดงผลลัพธ์และการฟ (Results & Charts) -->
    <div class="panel" id="result-panel" style="display: none;">
        <h2>ผลการวิเคราะห์</h2>
        
        <!-- พื้นที่สำหรับแสดงกราฟ (ซ่อนไว้ก่อนจนกว่าจะเรียก Deep Report) -->
        <div class="charts-container" id="charts-wrapper" style="display: none;">
            <div class="chart-box">
                <canvas id="potentialRadarChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="potentialBarChart"></canvas>
            </div>
        </div>

        <!-- พื้นที่แสดงข้อความ (Markdown) -->
        <div id="report-content"></div>
    </div>

</div>

<!-- JavaScript Logic (Core Engine) -->
<script>
    let currentChartData = null;
    let radarChartInstance = null;
    let barChartInstance = null;

    // 1. ฟังก์ชันป้องกัน Error Unexpected token '<' จาก Backend HTML Response
    async function safeFetchJson(url, options) {
        const res = await fetch(url, options);
        const contentType = res.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            const errorHtml = await res.text();
            console.error("RAW SERVER ERROR HTML:", errorHtml);
            throw new Error(`เซิร์ฟเวอร์ขัดข้อง (HTTP ${res.status}): โปรดตรวจสอบ Logs ฝั่ง Render`);
        }

        const data = await res.json();
        if (!res.ok || data.status === "error") {
            throw new Error(data.message || "เกิดข้อผิดพลาดในการประมวลผล");
        }
        return data;
    }

    function showStatus(message, isError = false) {
        const statusEl = document.getElementById("status-message");
        statusEl.style.display = "block";
        statusEl.textContent = message;
        statusEl.className = isError ? "error-text" : "";
    }

    // 2. คำนวณองศาดาวและดึง Transit (ขั้นตอนแรกสุด)
    async function calculateChart() {
        showStatus("กำลังคำนวณองศาดาวกำเนิดและดาวจร Real-time...");
        document.getElementById("btn-calculate").disabled = true;

        const payload = {
            day: parseInt(document.getElementById("day").value),
            month: parseInt(document.getElementById("month").value),
            year: parseInt(document.getElementById("year").value),
            hour: parseInt(document.getElementById("hour").value),
            minute: parseInt(document.getElementById("minute").value),
            location_name: document.getElementById("location_name").value
        };

        try {
            const data = await safeFetchJson('/calculate_chart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            currentChartData = data;
            showStatus("คำนวณดวงชะตาสำเร็จ! กรุณาเลือกโหมดการวิเคราะห์ด้านล่าง");
            
            // เปิดใช้งานปุ่มวิเคราะห์ AI
            document.getElementById("btn-natal7").disabled = false;
            document.getElementById("btn-deep").disabled = false;
            document.getElementById("btn-transit").disabled = false;
        } catch (error) {
            showStatus(`Error: ${error.message}`, true);
        } finally {
            document.getElementById("btn-calculate").disabled = false;
        }
    }

    // 3. ส่งข้อมูลดวงให้ AI วิเคราะห์ตามประเภทที่เลือก
    async function analyzeAI(reportType) {
        if (!currentChartData) {
            alert("กรุณากดคำนวณองศาดาวก่อนวิเคราะห์");
            return;
        }

        showStatus("AI กำลังวิเคราะห์เจาะลึก... (อาจใช้เวลา 20-30 วินาที)");
        document.getElementById("result-panel").style.display = "block";
        document.getElementById("report-content").innerHTML = "";
        document.getElementById("charts-wrapper").style.display = "none";

        const payload = {
            user_name: document.getElementById("user_name").value,
            chart_data: currentChartData,
            report_type: reportType,
            question: document.getElementById("question").value
        };

try {
    const data = await safeFetchJson('/analyze_ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    // 1. นำ Report ไปเรนเดอร์เป็น Markdown
    let reportText = data.report || data.answer;
    document.getElementById("report-content").innerHTML = marked.parse(reportText);

    // 2. ถ้ามีข้อมูลกราฟ ให้แสดงคอนเทนเนอร์และวาดกราฟ
    if (reportType === 'deep_report' && data.radar_data && data.radar_data.length > 0) {
        document.getElementById("charts-wrapper").style.display = "flex";
        renderCharts(data.radar_data, data.bar_data);
    } else {
        document.getElementById("charts-wrapper").style.display = "none";
    }
    
    showStatus("วิเคราะห์เสร็จสมบูรณ์!");
} catch (error) {
    showStatus(`Error: ${error.message}`, true);
}

    // 4. ระบบวาดกราฟ Dark Uranian Potential Map (Chart.js)
    function renderCharts(radarData, barData) {
        // เคลียร์กราฟเก่าทิ้งถ้ามี
        if (radarChartInstance) radarChartInstance.destroy();
        if (barChartInstance) barChartInstance.destroy();

        if (radarData && radarData.length > 0) {
            const ctxRadar = document.getElementById('potentialRadarChart').getContext('2d');
            radarChartInstance = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: radarData.map(item => item.name),
                    datasets: [{
                        label: 'Astrological Potential',
                        data: radarData.map(item => item.score),
                        backgroundColor: 'rgba(107, 76, 230, 0.3)',
                        borderColor: 'rgba(107, 76, 230, 1)',
                        pointBackgroundColor: '#fff',
                        pointBorderColor: 'rgba(107, 76, 230, 1)'
                    }]
                },
                options: {
                    scales: { r: { min: 0, max: 100, ticks: { color: '#a0aec0', backdropColor: 'transparent' }, grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: '#e2e8f0' } } },
                    plugins: { legend: { labels: { color: '#e2e8f0' } } }
                }
            });
        }

        if (barData && barData.length > 0) {
            const ctxBar = document.getElementById('potentialBarChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barData.map(item => item.name),
                    datasets: [
                        { label: 'Potential', data: barData.map(item => item.potential), backgroundColor: '#3182ce' },
                        { label: 'Activation', data: barData.map(item => item.activation), backgroundColor: '#38a169' },
                        { label: 'Block (แรงต้าน)', data: barData.map(item => item.block), backgroundColor: '#e53e3e' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0aec0' } },
                        x: { grid: { display: false }, ticks: { color: '#a0aec0' } }
                    },
                    plugins: { legend: { labels: { color: '#e2e8f0' } } }
                }
            });
        }
    }
</script>

</body>
</html>
