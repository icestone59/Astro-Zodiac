<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolutionary Astrology Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
  /* การ์ดแสดงผลฝั่งขวา (Insight Analytics Panel) */
.panel:nth-child(2) {
    background: #130a2a !important; /* สีม่วงน้ำเงินเข้มลึก ลึกลับลักชัวรี */
    border: 1px solid rgba(245, 158, 11, 0.3) !important; /* เส้นขอบทองบางเบา */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* หัวข้อบทวิเคราะห์ (1. นิสัย บุคลิกภาพ, 2. การเงิน ฯลฯ) */
.report-content-area h1, 
.report-content-area h2, 
.report-content-area h3, 
.report-content-area h4,
.report-content-area strong {
    color: #fbbf24 !important; /* สีเหลืองทองสว่าง (Amber Gold) */
    font-weight: 700;
    letter-spacing: 0.3px;
}

/* เนื้อหาบทบรรยายหลัก */
.report-content-area p,
.report-content-area li {
    color: #f8fafc !important; /* สีขาวบริสุทธิ์ อ่านชัดเจนบนพื้นหลังมืด */
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 16px;
}

/* บรรทัด "ที่มา:" สำหรับเวอร์ชั่นโหร */
.report-content-area em,
.report-content-area blockquote {
    color: #cbd5e1 !important; /* สีเทาสว่างนุ่มตา */
    border-left: 3px solid #f59e0b;
    padding-left: 12px;
    display: block;
    margin-top: 8px;
    font-style: normal;
    font-size: 13px;
}

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            max-width: 1280px;
            width: 100%;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--accent-purple); margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
        }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* SINGLE TOGGLE SWITCH STYLING */
        .mode-toggle-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #a855f7; }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-deep-report {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .report-content-area {
            min-height: 400px;
            line-height: 1.8;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LEFT PANEL: FORM INPUT -->
    <div class="panel">
        <h3 style="color: var(--accent-purple); margin-top:0;">✨ EVOLUTIONARY ASTROLOGY ENGINE</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-top: -8px; margin-bottom: 20px;">โหราศาสตร์สากลเชิงพัฒนาศักยภาพ</p>
        
        <div class="form-group">
            <label>ชื่อผู้ใช้</label>
            <input type="text" id="user_name" value="คุณไอซ์">
        </div>

        <div class="form-group">
            <label>วัน / เดือน / ปีเกิด (พ.ศ.)</label>
            <div class="grid-3">
                <input type="number" id="day" value="25" placeholder="วัน">
                <input type="number" id="month" value="5" placeholder="เดือน">
                <input type="number" id="year" value="2520" placeholder="ปี พ.ศ.">
            </div>
        </div>

        <div class="form-group">
            <label>เวลาเกิด (ชั่วโมง : นาที)</label>
            <div class="grid-2">
                <input type="number" id="hour" value="10" placeholder="ชม.">
                <input type="number" id="minute" value="51" placeholder="นาที">
            </div>
        </div>

        <div class="form-group">
            <label>จังหวัดที่เกิด</label>
            <select id="location_name">
                <option value="กรุงเทพมหานคร" selected>กรุงเทพมหานคร</option>
                <option value="เชียงใหม่">เชียงใหม่</option>
                <option value="ขอนแก่น">ขอนแก่น</option>
                <option value="ชลบุรี">ชลบุรี</option>
                <option value="สงขลา">สงขลา</option>
            </select>
        </div>

        <div class="form-group">
            <label>คำถามเจาะจง (Transit vs Natal - เว้นว่างได้)</label>
            <input type="text" id="question" placeholder="เช่น ผมจะได้งานเมื่อไหร่">
        </div>

        <!-- SINGLE TOGGLE SWITCH -->
        <div class="mode-toggle-card">
            <span style="font-size: 13px; color: #cbd5e1;">👤 เวอร์ชั่นลูกค้า</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="handleModeToggle()">
                <span class="slider"></span>
            </label>
            <span style="font-size: 13px; color: #a78bfa;">🔮 เวอร์ชั่นโหร</span>
        </div>

        <button class="btn-submit" id="btn-calculate" onclick="calculateChart()">คำนวณตำแหน่งดาวและวิเคราะห์</button>
        <button class="btn-deep-report" onclick="openDeepReportPage()">🔍 กดดูชะตาของคุณ (ปมลึก)</button>
    </div>

    <!-- RIGHT PANEL: DISPLAY REPORT & QUOTES -->
    <div class="panel">
        <div class="status-bar">
            <span style="font-weight: 600; color: var(--accent-purple);">✦ INSIGHT ANALYTICS</span>
            <span id="status-pill" style="font-size: 12px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); color: #10b981;">Ready</span>
        </div>

        <!-- DISPLAY AREA -->
        <div class="report-content-area" id="natal-report-content">
            <p id="default-message" style="color: #94a3b8; text-align: center; margin-top: 100px;">
                กรอกข้อมูลทางซ้ายมือแล้วกดปุ่ม "คำนวณตำแหน่งดาวและวิเคราะห์" เพื่อดูผลลัพธ์
            </p>
        </div>
    </div>
</div>

<script src="quotes.js"></script>
<script src="logic.js"></script>

</body>
</html>
