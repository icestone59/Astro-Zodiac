<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolutionary Astrology Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .prose h1, .prose h2, .prose h3 { color: #818cf8; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose ol, .prose ul { margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Top Navigation & Real-time Transit Ticker -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    EVOLUTIONARY ASTROLOGY ENGINE
                </h1>
            </div>
            <!-- Ticker สำหรับแสดง Real-time Transit -->
            <div id="transitTicker" class="text-xs text-slate-400 flex flex-wrap items-center gap-3 overflow-x-auto max-w-full py-1">
                <span>กำลังโหลดข้อมูลดาวจร Real-time...</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Column Left: Birth Input & Chart Visualization (5 Cols) -->
        <section class="lg:col-span-5 space-y-6">
            <!-- Form Input Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                <h2 class="text-md font-semibold text-indigo-400 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    ข้อมูลวันเวลาและสถานที่เกิด
                </h2>
                
                <form id="astroForm" class="space-y-4">
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">วัน</label>
                            <input type="number" id="day" value="15" min="1" max="31" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">เดือน</label>
                            <input type="number" id="month" value="8" min="1" max="12" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">ปี (ค.ศ.)</label>
                            <input type="number" id="year" value="1995" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">ชั่วโมง (0-23)</label>
                            <input type="number" id="hour" value="14" min="0" max="23" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">นาที (0-59)</label>
                            <input type="number" id="minute" value="30" min="0" max="59" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">สถานที่เกิด (เมือง, ประเทศ)</label>
                        <input type="text" id="location_name" value="Bangkok, Thailand" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="เช่น Chiang Mai, Thailand">
                    </div>

                    <div class="border-t border-slate-800 pt-3">
                        <label class="block text-xs text-indigo-300 mb-1">คำถามเจาะจง (ระบุ Transit vs Natal - เว้นว่างได้)</label>
                        <input type="text" id="question" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="เช่น ผมจะได้งานช่วงไหน / ปัญหาการเงินแก้อย่างไร">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-lg text-sm flex justify-center items-center gap-2">
                        <span>คำนวณตำแหน่งดาวและวิเคราะห์</span>
                    </button>
                </form>
            </div>

            <!-- SVG Birth Chart Container -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center min-h-[350px]">
                <h3 class="text-xs font-semibold text-slate-400 mb-3 self-start">BIRTH CHART WHEEL (ASTRO-SEEK STYLE)</h3>
                <div id="chartContainer" class="w-full max-w-[400px] aspect-square flex items-center justify-center">
                    <div class="text-slate-600 text-xs text-center">กรอกข้อมูลและกดวิเคราะห์เพื่อสร้างวงกลมดวงชะตา</div>
                </div>
            </div>
        </section>

        <!-- Column Right: Analysis Report (7 Cols) -->
        <section class="lg:col-span-7">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 min-h-[650px] shadow-xl flex flex-col">
                <div class="border-b border-slate-800 pb-3 mb-4 flex justify-between items-center">
                    <h2 class="text-md font-semibold text-cyan-400">ผลการวิเคราะห์เชิงพัฒนาศักยภาพ</h2>
                    <span id="statusBadge" class="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">Ready</span>
                </div>

                <!-- Content Display Area -->
                <div id="reportOutput" class="prose prose-invert max-w-none text-slate-300 text-sm flex-1 overflow-y-auto">
                    <div class="flex flex-col items-center justify-center h-64 text-slate-500 text-center space-y-3">
                        <svg class="w-12 h-12 text-slate-700 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <p>ระบบพร้อมประมวลผลตำแหน่งดาว Real-time และบทวิเคราะห์พื้นดวง 7 หมวดหมู่</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Handling -->
    <script>
        // Fetch Real-time Transit on Page Load
        async function fetchRealtimeTransit() {
            try {
                const res = await fetch('/transit');
                const data = await res.json();
                if (data?.transits) {
                    const planets = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'];
                    const tickerHtml = planets.map(p => {
                        const info = data.transits[p];
                        const sign = (info?.sign || '').toUpperCase();
                        const deg = info?.formatted || '';
                        return `<span class="bg-slate-800 px-2 py-0.5 rounded border border-slate-700"><strong class="text-indigo-400">${p}:</strong> ${sign} ${deg}</span>`;
                    }).join('');
                    document.getElementById('transitTicker').innerHTML = `<span class="text-emerald-400 font-bold">TRANSIT REAL-TIME:</span> ` + tickerHtml;
                }
            } catch (err) {
                console.error("Transit Error:", err);
                document.getElementById('transitTicker').innerText = "ไม่สามารถโหลดข้อมูลดาวจรได้";
            }
        }

        // Form Submission Handler
        document.getElementById('astroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusBadge = document.getElementById('statusBadge');
            const reportOutput = document.getElementById('reportOutput');
            const chartContainer = document.getElementById('chartContainer');

            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> <span>กำลังประมวลผล...</span>`;
            statusBadge.className = "text-[10px] bg-amber-900/50 text-amber-300 border border-amber-700 px-2.5 py-1 rounded-full animate-pulse";
            statusBadge.innerText = "Processing";

            const payload = {
                day: parseInt(document.getElementById('day').value),
                month: parseInt(document.getElementById('month').value),
                year: parseInt(document.getElementById('year').value),
                hour: parseInt(document.getElementById('hour').value),
                minute: parseInt(document.getElementById('minute').value),
                location_name: document.getElementById('location_name').value,
                question: document.getElementById('question').value.trim() || null
            };

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'เกิดข้อผิดพลาดในการประมวลผล');
                }

                // Render Birth Chart SVG (Safe Injection)
                if (result?.chart_svg) {
                    chartContainer.innerHTML = result.chart_svg;
                }

                // Render Report / Answer
                if (result?.answer) {
                    // Q&A Response
                    reportOutput.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-indigo-950/40 border border-indigo-800/50 p-4 rounded-lg">
                                <h3 class="text-xs text-indigo-400 font-bold uppercase tracking-wider mb-1">คำถามของคุณ</h3>
                                <p class="text-base text-white font-medium">"${result.question}"</p>
                            </div>
                            <div class="prose prose-invert max-w-none text-slate-200">
                                ${formatMarkdown(result.answer)}
                            </div>
                        </div>
                    `;
                } else if (result?.report) {
                    // 7 Categories Report Response
                    reportOutput.innerHTML = `
                        <div class="prose prose-invert max-w-none text-slate-200">
                            ${formatMarkdown(result.report)}
                        </div>
                    `;
                }

                statusBadge.className = "text-[10px] bg-emerald-900/50 text-emerald-300 border border-emerald-700 px-2.5 py-1 rounded-full";
                statusBadge.innerText = "Completed";

            } catch (err) {
                reportOutput.innerHTML = `<div class="p-4 bg-rose-950/50 border border-rose-800 rounded-lg text-rose-300 text-sm">❌ ${err.message}</div>`;
                statusBadge.className = "text-[10px] bg-rose-900/50 text-rose-300 border border-rose-700 px-2.5 py-1 rounded-full";
                statusBadge.innerText = "Error";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>คำนวณตำแหน่งดาวและวิเคราะห์</span>`;
            }
        });

        // Simple Markdown Formatter Helper
        function formatMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold text-indigo-400 mt-4 mb-2">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold text-cyan-400 mt-5 mb-2">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold text-white mt-6 mb-3">$1</h1>')
                .replace(/^\* (.*$)/gim, '<li class="ml-4 list-disc">$1</li>')
                .replace(/^\d+\.\s(.*$)/gim, '<li class="ml-4 list-decimal font-medium text-slate-100">$1</li>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-300 font-semibold">$1</strong>')
                .replace(/\n\n/g, '<br><br>');
        }

        // Initialize Real-time Transit
        fetchRealtimeTransit();
    </script>
</body>
</html>
