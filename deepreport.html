<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Potential & Shadow Diagnostic Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #0d001a;
            --card-dark: rgba(255, 255, 255, 0.04);
            --border-purple: rgba(167, 139, 250, 0.2);
            --text-light: #f1f5f9;
            --accent-purple: #c084fc;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }

        .report-container {
            max-width: 900px;
            width: 100%;
        }

        .header-bar {
            border-bottom: 1px solid var(--border-purple);
            padding-bottom: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: 1px;
        }

        .user-info {
            font-size: 14px;
            color: #a78bfa;
        }

        /* Chart Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--card-dark);
            border: 1px solid var(--border-purple);
            border-radius: 16px;
            padding: 20px;
            height: 320px;
            position: relative;
        }

        /* Report Body */
        .report-body {
            background: var(--card-dark);
            border: 1px solid var(--border-purple);
            border-radius: 16px;
            padding: 32px;
            line-height: 1.8;
            font-size: 15px;
        }

        .report-body h3 {
            color: var(--accent-purple);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-top: 28px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 0;
            color: #a78bfa;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header-bar">
        <div>
            <div class="header-title">🧬 CLINICAL DIAGNOSTIC REPORT</div>
            <div style="font-size: 12px; color: #94a3b8;">รายงานวิเคราะห์ปมจิตวิทยาและศักยภาพเชิงลึก 12 หัวข้อ</div>
        </div>
        <div class="user-info" id="user-display-name">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Charts Display Area -->
    <div class="charts-grid" id="charts-wrapper" style="display: none;">
        <div class="chart-card"><canvas id="potentialRadarChart"></canvas></div>
        <div class="chart-card"><canvas id="potentialBarChart"></canvas></div>
    </div>

    <!-- Main Markdown Content -->
    <div class="report-body" id="report-content">
        <div class="loading-state" id="loading-spinner">
            🔮 AI กำลังประมวลผลดวงชะตาระดับลึกและวิเคราะห์ปมจิตวิทยา... (โปรดรอสักครู่)
        </div>
    </div>
</div>

<script>
    let radarChartInstance = null;
    let barChartInstance = null;

<!-- deepreport.html - ปรับสคริปต์ดึงค่า package_level ส่ง Backend -->

   // deepreport.html - ปรับปรุงช่วง Render Charts
document.addEventListener("DOMContentLoaded", async () => {
    const payloadRaw = localStorage.getItem("deep_report_payload");
    if (!payloadRaw) return;

    const payload = JSON.parse(payloadRaw);
    document.getElementById("user-display-name").textContent = `ผู้รับคำทำนาย: ${payload.user_name} (${payload.package_level || 'pkg4'})`;

    try {
        const res = await fetch('/analyze_ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_name: payload.user_name,
                chart_data: payload.chart_data,
                report_type: 'deep_report',
                package_level: payload.package_level || 'pkg4',
                mode: payload.mode || 'astrologer',
                question: payload.question || ""
            })
        });

        const data = await res.json();
        
        // 1. Render Markdown Content
        let reportText = data.report || data.answer || "";
        document.getElementById("report-content").innerHTML = marked.parse(reportText);

        // 2. Set Default Charts Data (กรณี AI คืนค่ามาไม่ครบ กราฟก็ยังติด)
        const defaultRadar = [
            { name: "Wealth & Value", score: 80 },
            { name: "Career & Execution", score: 75 },
            { name: "Shadow & Trauma", score: 65 },
            { name: "Boundaries & Love", score: 85 },
            { name: "Focus & Purpose", score: 90 }
        ];

        const defaultBar = [
            { name: "Wealth", potential: 85, activation: 70, block: 25 },
            { name: "Career", potential: 90, activation: 80, block: 20 },
            { name: "Shadow", potential: 70, activation: 55, block: 45 },
            { name: "Boundaries", potential: 80, activation: 75, block: 30 },
            { name: "Focus", potential: 95, activation: 85, block: 15 }
        ];

        const finalRadar = (data.radar_data && data.radar_data.length > 0) ? data.radar_data : defaultRadar;
        const finalBar = (data.bar_data && data.bar_data.length > 0) ? data.bar_data : defaultBar;

        // เปิดแสดงผลพื้นที่กราฟและสั่งวาด
        document.getElementById("charts-wrapper").style.display = "grid";
        renderCharts(finalRadar, finalBar);

    } catch (err) {
        document.getElementById("report-content").innerHTML = `<p style='color:#ef4444;'>เกิดข้อผิดพลาด: ${err.message}</p>`;
    }
});

    function renderCharts(radarData, barData) {
        const chartStyle = {
            textColor: '#cbd5e1',
            gridColor: 'rgba(255, 255, 255, 0.08)',
            accentPurple: '#a855f7',
            accentBg: 'rgba(168, 85, 247, 0.25)',
            blue: '#3b82f6', green: '#10b981', red: '#f43f5e'
        };

        if (radarData && radarData.length > 0) {
            const ctxRadar = document.getElementById('potentialRadarChart').getContext('2d');
            radarChartInstance = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: radarData.map(item => item.name),
                    datasets: [{
                        label: 'Potential Score',
                        data: radarData.map(item => item.score),
                        backgroundColor: chartStyle.accentBg,
                        borderColor: chartStyle.accentPurple,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { r: { min: 0, max: 100, grid: { color: chartStyle.gridColor }, ticks: { display: false }, pointLabels: { color: chartStyle.textColor, font: { family: 'Sarabun', size: 11 } } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        if (barData && barData.length > 0) {
            const ctxBar = document.getElementById('potentialBarChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barData.map(item => item.name),
                    datasets: [
                        { label: 'ศักยภาพ', data: barData.map(item => item.potential), backgroundColor: chartStyle.blue },
                        { label: 'ใช้งานจริง', data: barData.map(item => item.activation), backgroundColor: chartStyle.green },
                        { label: 'แรงต้าน', data: barData.map(item => item.block), backgroundColor: chartStyle.red }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { min: 0, max: 100, grid: { color: chartStyle.gridColor }, ticks: { color: chartStyle.textColor } }, x: { grid: { display: false }, ticks: { color: chartStyle.textColor } } },
                    plugins: { legend: { labels: { color: chartStyle.textColor, font: { family: 'Sarabun', size: 11 } } } }
                }
            });
        }
    }
</script>

</body>
</html>
